name: KIRION Workbench Sort Lab

on:
  push:
    branches: [main]
    paths:
      - 'jsondb-lab/workbench/public/bootstrap.js'
      - 'jsondb-lab/workbench/public/audio.js'
      - 'jsondb-lab/workbench/public/sort-core.js'
      - 'jsondb-lab/workbench/public/sort-lab.js'
      - 'jsondb-lab/workbench/public/sort-lab.css'
      - 'jsondb-lab/workbench/sort-core-selftest.js'
      - 'jsondb-lab/workbench/server.js'
      - '.github/workflows/workbench-sort-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sort-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check visual/audio lane
        shell: pwsh
        run: |
          node --check ./jsondb-lab/workbench/public/bootstrap.js
          node --check ./jsondb-lab/workbench/public/audio.js
          node --check ./jsondb-lab/workbench/public/sort-core.js
          node --check ./jsondb-lab/workbench/public/sort-lab.js
          node --check ./jsondb-lab/workbench/sort-core-selftest.js
          node --check ./jsondb-lab/workbench/server.js

      - name: Prove all sorting planners
        shell: pwsh
        run: node ./jsondb-lab/workbench/sort-core-selftest.js

      - name: Prove exact static allowlist assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WORKBENCH_PORT = '7435'
          $stdout = Join-Path $env:RUNNER_TEMP 'sort-workbench-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'sort-workbench-err.log'
          $p = Start-Process node -ArgumentList './jsondb-lab/workbench/server.js' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              if ($p.HasExited) { throw "Workbench exited early with code $($p.ExitCode)." }
              try {
                Invoke-WebRequest 'http://127.0.0.1:7435/' -UseBasicParsing -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Workbench did not become ready.' }

            $assets = @(
              '/app.js',
              '/core-app.js',
              '/sort-core.js',
              '/audio.js',
              '/sort-lab.js',
              '/sort-lab.css'
            )
            foreach ($asset in $assets) {
              $response = Invoke-WebRequest ("http://127.0.0.1:7435" + $asset) -UseBasicParsing
              if ($response.StatusCode -ne 200) { throw "$asset returned $($response.StatusCode)" }
              if ($response.Content.Length -lt 20) { throw "$asset was unexpectedly empty" }
              Write-Host "PASS $asset bytes=$($response.Content.Length)"
            }

            $notFound = $false
            try {
              Invoke-WebRequest 'http://127.0.0.1:7435/not-allowlisted.js' -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) { $notFound = $true }
            }
            if (-not $notFound) { throw 'Unknown static asset did not fail closed with 404.' }

            $bootstrap = (Invoke-WebRequest 'http://127.0.0.1:7435/app.js' -UseBasicParsing).Content
            foreach ($expected in @('/sort-core.js','/audio.js','/sort-lab.js','/core-app.js')) {
              if (-not $bootstrap.Contains($expected)) { throw "Bootstrap missing $expected" }
            }
          }
          catch {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
