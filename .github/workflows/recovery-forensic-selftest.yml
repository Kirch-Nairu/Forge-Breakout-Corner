name: Recovery Forensic Self-Test

on:
  push:
    branches: [main]
    paths:
      - 'jsondb-lab/**'
      - '.github/workflows/recovery-forensic-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-forensic-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check JSONDB lab JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find jsondb-lab -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Bootstrap isolated recovery state
        run: node jsondb-lab/recovery-selftest.js --bootstrap

      - name: Build representative Last Savior archive
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('path');
          const { FederatedOmegaKernel } = require('./jsondb-lab/monster/federated-kernel');

          async function main() {
            const kernel = new FederatedOmegaKernel(path.join(process.cwd(), 'jsondb-lab'));
            await kernel.init();
            const archive = await kernel.lastSavior.create('ci-forensic-fixture', {
              scatter: false,
              deepMedia: false,
              verifyArchives: false,
              monteCarloIterations: 250,
              syndromeChecksPerNode: 2,
              shadowLawsPerCollection: 2,
              hologramWidth: 16,
              hologramProjections: 2,
              oligoBytes: 128,
              oligoGroupSize: 4,
              spacetimeEpochs: 2,
              spacetimeColumns: 2
            });
            if (!archive?.id) throw new Error('LAST SAVIOR fixture creation returned no archive id.');
            process.stdout.write(`${JSON.stringify({ id: archive.id, archiveHash: archive.archiveHash, federationId: archive.world?.federationId }, null, 2)}\n`);
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify Last Savior fixture semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('path');
          const { FederatedOmegaKernel } = require('./jsondb-lab/monster/federated-kernel');

          async function main() {
            const kernel = new FederatedOmegaKernel(path.join(process.cwd(), 'jsondb-lab'));
            const result = await kernel.lastSavior.verify(null, { live: false, readOnly: true });
            process.stdout.write(`${JSON.stringify({
              valid: result.valid,
              id: result.id,
              healthyChannels: result.healthyChannels,
              totalBooleanChannels: result.totalBooleanChannels,
              independentEvidence: result.independentEvidence
            }, null, 2)}\n`);
            if (!result.valid) {
              process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
              process.exitCode = 1;
            }
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Build representative policy and planning artifacts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('path');
          const { FederatedOmegaKernel } = require('./jsondb-lab/monster/federated-kernel');

          async function main() {
            const kernel = new FederatedOmegaKernel(path.join(process.cwd(), 'jsondb-lab'));
            await kernel.init();

            const plan = await kernel.recoveryNavigator.plan({ goal: 'world', minimumCorroborators: 2 });
            const planCheck = await kernel.recoveryNavigator.verify(plan.id);
            if (!planCheck.valid) throw new Error(`Navigator fixture failed verification: ${plan.id}`);

            const checkpoint = await kernel.policyCheckpoint.capture('ci-policy-fixture');
            const proof = await kernel.proofPlan.create('ci-proof-fixture', { planId: plan.id, allowBlocked: true });

            const mutation = await kernel.planMutation.run('ci-mutation-fixture', {
              goal: 'world',
              minimumCorroborators: 2,
              capabilities: ['memoryPalace'],
              pairLimit: 0
            });
            const mutationAudit = await kernel.mutationAudit.verify(mutation.id);
            if (!mutationAudit.valid) {
              process.stdout.write(`${JSON.stringify(mutationAudit, null, 2)}\n`);
              throw new Error(`Mutation audit fixture failed: ${mutation.id}`);
            }

            const court = await kernel.historyCourt.compare('federation', 'federation', { previewMerge: false });

            process.stdout.write(`${JSON.stringify({
              navigator: { id: plan.id, status: plan.status, valid: planCheck.valid, source: plan.source?.id || null },
              checkpoint: { id: checkpoint.id, checkpointHash: checkpoint.checkpointHash },
              proofPlan: { id: proof.id, dossierHash: proof.dossierHash },
              mutation: { id: mutation.id, summary: mutation.summary },
              mutationAudit: { valid: mutationAudit.valid, replayValid: mutationAudit.replayValid },
              historyCourt: { id: court.id, verdict: court.verdict, caseHash: court.caseHash }
            }, null, 2)}\n`);
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Evolve Recovery Contracts and verify historical policy drift
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('path');
          const { FederatedOmegaKernel } = require('./jsondb-lab/monster/federated-kernel');

          async function main() {
            const kernel = new FederatedOmegaKernel(path.join(process.cwd(), 'jsondb-lab'));
            const before = await kernel.recoveryContracts.inspect();
            if (!before.valid || !before.registryHash) throw new Error('Pre-drift Recovery Contract registry is not valid.');

            const next = await kernel.recoveryContracts.reset();
            if (!next?.registryHash || next.registryHash === before.registryHash) {
              throw new Error('Recovery Contract evolution did not produce a distinct registry hash.');
            }

            const [archive, checkpoint, proof, navigator, mutation, mutationAudit, firewall] = await Promise.all([
              kernel.lastSavior.verify(null, { live: false, readOnly: true }),
              kernel.policyCheckpoint.verify(null, { readOnly: true }),
              kernel.proofPlan.verify(null, { readOnly: true }),
              kernel.recoveryNavigator.verify(null, { readOnly: true }),
              kernel.planMutation.verify(null, { readOnly: true }),
              kernel.mutationAudit.verify(null, { readOnly: true }),
              kernel.authorityFirewall.verifyLedger({ readOnly: true })
            ]);

            const assertions = {
              archiveValid: archive.valid === true,
              archiveDriftReported: archive.policyDriftedSinceArchive === true,
              checkpointValid: checkpoint.valid === true,
              checkpointDriftReported: checkpoint.policyDriftedSinceCheckpoint === true,
              proofValid: proof.valid === true,
              proofDriftReported: proof.policyDriftedSinceDossier === true,
              navigatorValid: navigator.valid === true,
              navigatorDriftReported: navigator.policyDriftedSincePlan === true,
              mutationValid: mutation.valid === true,
              mutationAuditValid: mutationAudit.valid === true,
              firewallHistoryValid: firewall.valid === true
            };

            process.stdout.write(`${JSON.stringify({
              oldRegistryHash: before.registryHash,
              newRegistryHash: next.registryHash,
              assertions,
              archive: { id: archive.id, drift: archive.policyDriftedSinceArchive },
              checkpoint: { id: checkpoint.id, drift: checkpoint.policyDriftedSinceCheckpoint },
              proof: { id: proof.id, drift: proof.policyDriftedSinceDossier },
              navigator: { id: navigator.id, drift: navigator.policyDriftedSincePlan }
            }, null, 2)}\n`);

            const failed = Object.entries(assertions).filter(([, ok]) => !ok).map(([name]) => name);
            if (failed.length) throw new Error(`Historical policy drift assertions failed: ${failed.join(', ')}`);
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Inject corruption and prove forensic verification does not repair it
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fsp = require('fs/promises');
          const path = require('path');
          const { FederatedOmegaKernel } = require('./jsondb-lab/monster/federated-kernel');
          const { readJson } = require('./jsondb-lab/monster/jsonfs');

          async function testHistoricalContractFallback(kernel) {
            const archive = await readJson(path.join(kernel.lastSavior.root, 'latest.json'), null);
            const registryHash = archive?.corroborationFamilies?.recoveryContracts?.registryHash;
            if (!registryHash) throw new Error('LAST SAVIOR fixture has no historical Recovery Contract hash.');
            const versionFile = path.join(kernel.recoveryContracts.versions, `${registryHash}.json`);
            const original = await fsp.readFile(versionFile);
            const corrupt = Buffer.from(`${JSON.stringify({ format: 'CI-CORRUPTED-CONTRACT-VERSION', registryHash, contracts: {} })}\n`);
            try {
              await fsp.writeFile(versionFile, corrupt);
              const resolved = await kernel.recoveryContracts.version(registryHash, { hydrate: false });
              const after = await fsp.readFile(versionFile);
              const validation = kernel.recoveryContracts.validateRegistry(resolved);
              return {
                valid: Boolean(resolved?.registryHash === registryHash && validation.valid && after.equals(corrupt)),
                fallbackResolved: resolved?.registryHash === registryHash,
                fallbackConstitutionValid: validation.valid,
                corruptedVersionLeftUntouched: after.equals(corrupt)
              };
            } finally {
              await fsp.writeFile(versionFile, original);
            }
          }

          async function testMemoryPalaceNoRepair(kernel) {
            const manifest = await readJson(path.join(kernel.memory.root, 'latest.json'), null);
            const chunk = manifest?.chunks?.[0];
            if (!manifest?.id || !chunk?.hash) throw new Error('Memory Palace fixture has no chunk to corrupt.');
            const primary = kernel.memory.objectFile(chunk.hash);
            const original = await fsp.readFile(primary);
            const corrupt = Buffer.from('{"format":"CI-CORRUPTED-MEMORY-PRIMARY"}\n');
            try {
              await fsp.writeFile(primary, corrupt);
              const verification = await kernel.memory.verify(manifest.id, { readOnly: true });
              const after = await fsp.readFile(primary);
              const result = verification.chunkResults?.find(row => row.hash === chunk.hash) || null;
              return {
                valid: Boolean(verification.valid && result?.recovered && result.source && result.source !== 'primary' && after.equals(corrupt)),
                memoryVerificationValid: verification.valid,
                recoveredFrom: result?.source || null,
                corruptedPrimaryLeftUntouched: after.equals(corrupt)
              };
            } finally {
              await fsp.writeFile(primary, original);
            }
          }

          async function testFirewallFutureTail(kernel) {
            const ledger = kernel.authorityFirewall.ledger;
            const original = await fsp.readFile(ledger);
            const tampered = Buffer.concat([original, Buffer.from('{"ci":"tampered-future-tail"}\n')]);
            try {
              await fsp.writeFile(ledger, tampered);
              const checkpoint = await kernel.policyCheckpoint.verify(null, { readOnly: true });
              const live = await kernel.authorityFirewall.verifyLedger({ readOnly: true });
              const after = await fsp.readFile(ledger);
              return {
                valid: Boolean(checkpoint.valid && checkpoint.historicalPrefixValid && checkpoint.futureTailIncident === true && live.valid === false && after.equals(tampered)),
                historicalCheckpointStillValid: checkpoint.valid,
                historicalPrefixStillValid: checkpoint.historicalPrefixValid,
                futureTailIncidentReported: checkpoint.futureTailIncident === true,
                liveFirewallRejected: live.valid === false,
                corruptedTailLeftUntouched: after.equals(tampered)
              };
            } finally {
              await fsp.writeFile(ledger, original);
            }
          }

          async function main() {
            const kernel = new FederatedOmegaKernel(path.join(process.cwd(), 'jsondb-lab'));
            const results = {
              historicalContractFallback: await testHistoricalContractFallback(kernel),
              memoryPalaceNoRepair: await testMemoryPalaceNoRepair(kernel),
              firewallFutureTail: await testFirewallFutureTail(kernel)
            };
            process.stdout.write(`${JSON.stringify(results, null, 2)}\n`);
            const failed = Object.entries(results).filter(([, result]) => result.valid !== true).map(([name]) => name);
            if (failed.length) throw new Error(`Forensic corruption assertions failed: ${failed.join(', ')}`);
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify forensic read-only recovery state
        if: always()
        run: node jsondb-lab/recovery-selftest.js
