name: Recovery Authority Boundary

on:
  push:
    branches: [main]
    paths:
      - 'jsondb-lab/**'
      - '.github/workflows/recovery-authority-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-authority-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check JSONDB lab JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find jsondb-lab -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Exercise machine and human recovery authority boundaries
        run: node jsondb-lab/recovery-authority-selftest.js
