name: KIRION Qwen Dossier Experiment

on:
  push:
    branches:
      - KIRION-QWEN-DOSSIER-HANDOFF-EXPERIMENT
  pull_request:
    paths:
      - 'kirion-factory/qwen_dossier/**'
      - '.github/workflows/kirion-qwen-dossier.yml'

jobs:
  selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: kirion-factory/qwen_dossier
        run: python -m py_compile engine.py server.py question_bank.py selftest.py
      - name: Selftest
        working-directory: kirion-factory/qwen_dossier
        run: python selftest.py
