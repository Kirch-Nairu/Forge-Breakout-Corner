name: KIRION Workbench Integration

on:
  push:
    branches: [main]
    paths:
      - 'jsondb-lab/workbench/**'
      - 'jsondb-lab/monster/**'
      - '.github/workflows/workbench-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check Workbench
        run: |
          set -euo pipefail
          node --check jsondb-lab/workbench/domain.js
          node --check jsondb-lab/workbench/seeder.js
          node --check jsondb-lab/workbench/benchmark.js
          node --check jsondb-lab/workbench/server.js
          node --check jsondb-lab/workbench/public/app.js

      - name: Start Workbench
        env:
          WORKBENCH_PORT: '7434'
        run: |
          set -euo pipefail
          node jsondb-lab/workbench/server.js > /tmp/workbench.log 2>&1 &
          echo $! > /tmp/workbench.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:7434/api/schema > /tmp/schema.json; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/workbench.log
          exit 1

      - name: Prove schema and unresolved-domain honesty
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const schema = JSON.parse(fs.readFileSync('/tmp/schema.json','utf8'));
          if (schema.authority !== 'EXPLICIT_WRITE_APP') throw new Error('wrong authority');
          const known = new Set(schema.domains.map(x => x.id));
          for (const id of ['forge','earth','jupiter','mars']) if (!known.has(id)) throw new Error(`missing ${id}`);
          const unresolved = new Set(schema.unresolvedDomains.map(x => x.id));
          for (const id of ['kirion-saturn','project-second-brain']) if (!unresolved.has(id)) throw new Error(`missing unresolved ${id}`);
          if (!schema.scales.smoke) throw new Error('smoke scale absent');
          console.log(JSON.stringify({known:[...known], unresolved:[...unresolved], collections:schema.collections.length},null,2));
          NODE

      - name: Reject implicit write authority
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/rejected.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"scale":"smoke"}' \
            http://127.0.0.1:7434/api/seed)
          test "$code" = "403"
          cat /tmp/rejected.json

      - name: Seed synthetic KIRION ecosystem
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'X-Kirion-Workbench-Intent: write' \
            -d '{"scale":"smoke","seed":"CI-KIRION","runKey":"ci-smoke","batchSize":250}' \
            http://127.0.0.1:7434/api/seed > /tmp/seed.json
          node - <<'NODE'
          const fs = require('fs');
          const seed = JSON.parse(fs.readFileSync('/tmp/seed.json','utf8'));
          if (!seed.totalRows || seed.totalRows < 600) throw new Error(`unexpected seed volume ${seed.totalRows}`);
          if (seed.results.some(x => x.inserted <= 0)) throw new Error('empty seeded collection');
          console.log(JSON.stringify({runKey:seed.runKey,totalRows:seed.totalRows,collections:seed.results.length},null,2));
          NODE

      - name: Prove indexed planner query
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'X-Kirion-Workbench-Intent: write' \
            -d '{"query":{"from":"benchmark_records","where":{"field":"priority","op":"eq","value":1},"limit":100}}' \
            http://127.0.0.1:7434/api/query > /tmp/query.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/query.json','utf8'));
          if (result.explain.access.type !== 'index-scan') throw new Error(JSON.stringify(result.explain));
          if (result.explain.access.index !== 'benchmark_priority') throw new Error(`wrong index ${result.explain.access.index}`);
          console.log(JSON.stringify(result.explain,null,2));
          NODE

      - name: Run advanced benchmark
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'X-Kirion-Workbench-Intent: write' \
            -d '{"advancedIndexes":true,"durability":false,"vectorBuildLimit":1000}' \
            http://127.0.0.1:7434/api/benchmark > /tmp/benchmark.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/benchmark.json','utf8'));
          if (result.failed !== 0) {
            console.error(JSON.stringify(result,null,2));
            throw new Error(`benchmark failures=${result.failed}`);
          }
          const names = new Set(result.cases.map(x => x.name));
          for (const name of ['indexed-priority-equality','forced-full-scan-contains','forge-project-hash-join','historical-read','bplus-range-priority','earth-fulltext-search','mars-vector-graph-search','mars-vector-bruteforce']) {
            if (!names.has(name)) throw new Error(`missing benchmark case ${name}`);
          }
          const access = Object.fromEntries(result.plannerCases.map(x => [x.name,x.access]));
          if (access['indexed-priority-equality'] !== 'index-scan') throw new Error('indexed case not indexed');
          if (access['forced-full-scan-contains'] !== 'full-scan') throw new Error('scan case did not full-scan');
          console.log(JSON.stringify({passed:result.passed,total:result.total,totalDurationMs:result.totalDurationMs,plannerCases:result.plannerCases},null,2));
          NODE

      - name: Inspect final Workbench state
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:7434/api/state > /tmp/state.json
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const expected = ['kirion_projects','forge_work_packages','earth_cases','jupiter_events','mars_chunks','benchmark_records'];
          for (const name of expected) {
            const collection = state.collections.find(x => x.name === name);
            if (!collection?.present || collection.rows <= 0) throw new Error(`collection unhealthy ${name}`);
          }
          if (!state.lastBenchmark || state.lastBenchmark.failed !== 0) throw new Error('last benchmark unhealthy');
          console.log(JSON.stringify({rows:state.totals.workbenchRows,tx:state.engine.nextTx,lsn:state.engine.currentLsn,lastBenchmark:state.lastBenchmark},null,2));
          NODE

      - name: Workbench log on failure
        if: failure()
        run: cat /tmp/workbench.log || true

      - name: Stop Workbench
        if: always()
        run: |
          if [ -f /tmp/workbench.pid ]; then kill "$(cat /tmp/workbench.pid)" 2>/dev/null || true; fi
