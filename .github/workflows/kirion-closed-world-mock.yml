name: KIRION Closed-World Python Mock

on:
  push:
    branches:
      - KIRION-CLOSED-WORLD-PYTHON-MOCK
  pull_request:
    paths:
      - 'kirion-factory/mock_python/**'
      - '.github/workflows/kirion-closed-world-mock.yml'

jobs:
  selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: kirion-factory/mock_python
        run: python -m py_compile engine.py server.py selftest.py
      - name: Selftest
        working-directory: kirion-factory/mock_python
        run: python selftest.py
