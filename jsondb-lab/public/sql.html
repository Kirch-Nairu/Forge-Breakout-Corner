<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>JSONDB SQL Crime Lab</title><style>:root{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#e9f4ed;background:#080b09}*{box-sizing:border-box}body{margin:0}.shell{width:min(1200px,calc(100% - 28px));margin:auto;padding:30px 0}a{color:#75e2a7}h1{font:800 clamp(32px,6vw,70px)/.95 system-ui,sans-serif;letter-spacing:-.05em;margin:14px 0}.muted{color:#81938a;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.card{background:#101613;border:1px solid #28362f;border-radius:16px;padding:16px}textarea{width:100%;min-height:350px;background:#080d0a;border:1px solid #2a3931;color:#dff2e6;border-radius:12px;padding:14px;font:13px/1.6 inherit;resize:vertical}.out{white-space:pre-wrap;overflow:auto;max-height:620px;min-height:350px;background:#080d0a;border:1px solid #2a3931;color:#b8cabf;border-radius:12px;padding:14px;font-size:12px;line-height:1.55}button{margin-top:10px;border:0;border-radius:10px;background:#75e2a7;color:#07110b;padding:10px 14px;font-weight:900;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><a href="/">← Monster control plane</a><h1>SQL Crime Lab</h1><p class="muted">Write familiar-ish SQL. It gets compiled into the monster's JSON query AST, cost-ish planner, index scan, hash join, aggregate, projection, and time-travel machinery. It is intentionally not SQL-complete.</p><section class="grid"><article class="card"><textarea id="sql">EXPLAIN ANALYZE
SELECT id, slug, title, priority
FROM tasks
WHERE status = 'active' AND priority >= 5
ORDER BY priority DESC
LIMIT 50;</textarea><button id="run">Execute the bad decision</button></article><article class="card"><div class="out" id="out">Compiled AST and execution plan will appear here.</div></article></section></main><script>const out=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{out.textContent='Compiling SQL into JSON because apparently this is our life now…';try{const r=await fetch('/api/sql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql:document.querySelector('#sql').value})});const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='ERROR\n'+e.message}};</script></body></html>
